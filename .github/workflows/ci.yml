name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  deploy-dev:
    name: deploy (dev)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      # Wire to your static host / CDN once DEV_DEPLOY_HOOK is set in repo secrets.
      # Until then this step is a no-op so `main` stays green. See README "Deploy".
      - name: Trigger dev deploy
        env:
          DEV_DEPLOY_HOOK: ${{ secrets.DEV_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEV_DEPLOY_HOOK" ]; then
            echo "DEV_DEPLOY_HOOK not set — skipping deploy (configure in repo secrets)."
            exit 0
          fi
          curl -fsSL -X POST "$DEV_DEPLOY_HOOK"
          echo "Dev deploy triggered."
